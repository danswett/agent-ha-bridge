name: Release assets

# Attaches the native hook (hook/, docs/fast-hooks.md) to a release, with SHA256SUMS.
# Updates download the release's source archive, which cannot carry a compiled
# program, so the installer fetches the build for its machine from here.
#
# Against a DRAFT release, before publishing it:
#   1. create the release as a draft (tag name, notes);
#   2. push its tag (git tag vX.Y.Z <commit> && git push origin vX.Y.Z) - which runs
#      this - or run it by hand with the tag and commit;
#   3. check the assets are attached, then publish.
# Publishing first would leave a window in which a machine updating finds no build and
# keeps its PowerShell hooks until its next update. Automatic updates never see drafts,
# and a tag alone is not a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (e.g. v1.12.0); the release may be a draft
        required: true
      ref:
        description: The commit to build - the release's target
        required: true
        default: main

permissions:
  contents: write

jobs:
  native-hook:
    name: Build and attach the native hook
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: hook/go.mod
          cache-dependency-path: hook/go.sum

      - name: Test
        working-directory: hook
        run: go test ./...

      - name: Build every target
        run: bash hook/build-release.sh "${TAG#v}" "$PWD/dist"

      - name: Attach to the release
        working-directory: dist
        run: gh release upload "$TAG" agent-bridge-hook-* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
