name: CI

# release/** is here so a release branch cut from an older tag - the way a fix ships
# without the unreleased work stacked above it on main - is checked by the same jobs
# as main, on both the push and the pull request. Both filters are needed: push alone
# gives no pre-merge checks, and a branch protected on those checks could never merge.
#
# Note the bootstrap. A workflow runs from the commit being tested, so a release
# branch cut from a tag that predates this change carries the old filters and is not
# checked at all. This file therefore has to be the first thing placed on such a
# branch; adding it to main does not reach backwards into one already cut.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: PowerShell (parse, lint, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse-check every PowerShell file
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1 |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            ForEach-Object {
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
              if ($parseErrors -and $parseErrors.Count) {
                $errors += $parseErrors.Count
                foreach ($e in $parseErrors) {
                  Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                }
              }
            }
          if ($errors) { throw "$errors parse error(s) found" }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # The runner image sometimes ships without PSGallery registered, and is
          # migrating from PowerShellGet to PSResourceGet, so neither the repository
          # nor Install-Module can be assumed to be there.
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default -ErrorAction SilentlyContinue
            }
            if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
              Install-PSResource -Name PSScriptAnalyzer -TrustRepository -Scope CurrentUser -ErrorAction Stop
            }
            else {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
              Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
            }
          }
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $findings = Get-ChildItem -Recurse -Include *.ps1, *.psm1 |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1 }
          foreach ($f in $findings) {
            Write-Host "::warning file=$($f.ScriptName),line=$($f.Line)::$($f.RuleName): $($f.Message)"
          }
          if ($findings -and @($findings).Count) { throw "$(@($findings).Count) PSScriptAnalyzer finding(s)" }

      - uses: actions/setup-go@v7
        with:
          go-version-file: hook/go.mod
          cache-dependency-path: hook/go.sum

      - name: Native hook (Go) - vet, test, build every target
        shell: pwsh
        working-directory: hook
        run: |
          go vet ./...
          if ($LASTEXITCODE) { throw 'go vet failed' }
          go test ./...
          if ($LASTEXITCODE) { throw 'go test failed' }
          foreach ($target in 'windows/amd64', 'windows/arm64', 'darwin/amd64', 'darwin/arm64') {
            $env:GOOS, $env:GOARCH = $target -split '/'
            go build -trimpath -ldflags '-s -w' -o NUL .
            if ($LASTEXITCODE) { throw "build for $target failed" }
          }
          $env:GOOS = ''; $env:GOARCH = ''
          # The one test-native-hook.ps1 runs.
          go build -trimpath -ldflags '-s -w' -o agent-bridge-hook.exe .
          if ($LASTEXITCODE) { throw 'build failed' }

      - name: Canonical offline PowerShell suites
        id: offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $results = Join-Path $env:RUNNER_TEMP ("bridge-offline-{0}-{1}-{2}-{3}" -f
            $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:GITHUB_JOB, [guid]::NewGuid().ToString('N'))
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "results-directory=$results" -Encoding utf8
          $checkout = @(git rev-parse --verify HEAD)
          if ($LASTEXITCODE -ne 0 -or $checkout.Count -ne 1 -or $checkout[0] -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Cannot identify the checkout before the Offline run.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "checkout-sha=$($checkout[0])" -Encoding utf8
          $runner = Join-Path 'tests' 'run-tests.ps1'
          pwsh -NoProfile -File $runner -ResultsDirectory $results
          $runnerExit = $LASTEXITCODE
          exit $runnerExit

      # Success must retain the child-suite evidence too, not just a green job status.
      - name: Collect bounded Offline evidence
        id: offline-evidence
        if: ${{ always() }}
        shell: pwsh
        env:
          OFFLINE_RESULTS: ${{ steps.offline.outputs.results-directory }}
          OFFLINE_CHECKOUT_SHA: ${{ steps.offline.outputs.checkout-sha }}
          OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $bundle = Join-Path $tempRoot ("bridge-offline-evidence-" + [guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $bundle) { throw 'The evidence bundle already exists.' }
          [void](New-Item -ItemType Directory -Path $bundle -ErrorAction Stop)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "bundle-directory=$bundle" -Encoding utf8
          $sourceState = 'not-provided'
          $sourceErrorType = $null
          $results = $null
          if (-not [string]::IsNullOrWhiteSpace($env:OFFLINE_RESULTS)) {
            try {
              if (-not [IO.Path]::IsPathFullyQualified($env:OFFLINE_RESULTS)) { throw 'Results path is not absolute.' }
              $results = [IO.Path]::GetFullPath($env:OFFLINE_RESULTS)
              $comparison = if ($IsWindows) { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
              if (-not [string]::Equals([IO.Path]::GetDirectoryName($results), $tempRoot, $comparison)) {
                throw 'Results path is not a direct child of runner temp.'
              }
              $sourceState = 'missing'
              if (Test-Path -LiteralPath $results) {
                $directory = Get-Item -LiteralPath $results -Force
                if (-not $directory.PSIsContainer -or ($directory.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                  throw 'Results path is not an unlinked directory.'
                }
                $sourceState = 'present'
              }
            }
            catch {
              $sourceState = 'unavailable'
              $sourceErrorType = $_.Exception.GetType().FullName
            }
          }
          $names = @(
            'summary.json',
            'tests_test-registration-isolation_ps1.log',
            'tests_test-decision-lifecycle_ps1.log',
            'tests_test-write-boundary-callers_ps1.log'
          )
          $files = [Collections.Generic.List[object]]::new()
          foreach ($name in $names) {
            $entry = [ordered]@{ name = $name; state = 'missing'; bytes = $null; sha256 = $null; errorType = $null }
            if ($sourceState -eq 'unavailable') { $entry.state = 'unavailable' }
            elseif ($sourceState -eq 'present') {
              try {
                $source = Join-Path $results $name
                if (Test-Path -LiteralPath $source) {
                  $item = Get-Item -LiteralPath $source -Force
                  if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                    throw 'An allowlisted result is not an unlinked file.'
                  }
                  $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
                  $target = Join-Path $bundle $name
                  Copy-Item -LiteralPath $source -Destination $target -ErrorAction Stop
                  $entry.bytes = (Get-Item -LiteralPath $target).Length
                  $entry.sha256 = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
                  if ($entry.sha256 -cne $hash -or $entry.bytes -ne $item.Length) { throw 'Evidence copy differs from its source.' }
                  $entry.state = 'present'
                }
              }
              catch {
                $entry.state = 'error'
                $entry.errorType = $_.Exception.GetType().FullName
              }
            }
            $files.Add($entry)
          }
          $checkout = @(git rev-parse --verify HEAD)
          $checkoutSha = if ($LASTEXITCODE -eq 0 -and $checkout.Count -eq 1 -and $checkout[0] -cmatch '^[0-9a-f]{40}$') {
            $checkout[0]
          } else { $null }
          [ordered]@{
            schemaVersion = 1
            checkoutSha = $checkoutSha; offlineCheckoutSha = $env:OFFLINE_CHECKOUT_SHA
            eventSha = $env:CI_EVENT_SHA; workflowSha = $env:CI_WORKFLOW_SHA; workflowRef = $env:CI_WORKFLOW_REF
            prHeadSha = $(if ($env:CI_PR_HEAD_SHA) { $env:CI_PR_HEAD_SHA } else { $null })
            prBaseSha = $(if ($env:CI_PR_BASE_SHA) { $env:CI_PR_BASE_SHA } else { $null })
            runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT
            job = $env:GITHUB_JOB; os = $env:RUNNER_OS; offlineOutcome = $env:OFFLINE_OUTCOME
            sourceState = $sourceState; sourceErrorType = $sourceErrorType; files = $files.ToArray()
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $bundle 'provenance.json') -Encoding utf8
          if (-not $checkoutSha -or $sourceState -eq 'unavailable' -or @($files | Where-Object { $_.state -eq 'error' }).Count) {
            throw 'Offline evidence collection failed; see provenance.json for explicit availability states.'
          }
          if ($env:OFFLINE_OUTCOME -eq 'success' -and
              (@($files | Where-Object { $_.state -ne 'present' -or $_.bytes -eq 0 }).Count -or
               -not [StringComparer]::Ordinal.Equals($checkoutSha, $env:OFFLINE_CHECKOUT_SHA))) {
            throw 'A successful Offline run lacks required evidence or its checkout changed.'
          }

      - name: Upload bounded Offline evidence
        if: ${{ always() && steps.offline-evidence.outputs.bundle-directory != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ steps.offline-evidence.outputs.bundle-directory }}
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  macos:
    name: macOS (platform layer, tmux delivery, suites)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tmux
        run: brew list tmux >/dev/null 2>&1 || brew install tmux

      - name: Parse-check every PowerShell file
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Include *.ps1 | Where-Object { $_.FullName -notmatch '/node_modules/' } | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            foreach ($e in @($parseErrors)) { $errors++; Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
          }
          if ($errors) { throw "$errors parse error(s) found" }

      - name: Platform layer and tmux delivery
        shell: pwsh
        run: pwsh -NoProfile -File tests/run-tests.ps1 -Group Platform -AllowHostTests

      - name: Shell scripts
        run: |
          bash -n bootstrap.sh
          sh -n bin/agent-ha-bridge
          bash tests/test-bootstrap.sh

      - name: Dashboard cards (JavaScript)
        run: |
          node --check frontend/agent-bridge-reply-card.js
          node frontend/test/test-cards.js

      - uses: actions/setup-go@v7
        with:
          go-version-file: hook/go.mod
          cache-dependency-path: hook/go.sum

      - name: Native hook (Go) - vet, test, build
        working-directory: hook
        run: |
          go vet ./...
          go test ./...
          go build -trimpath -ldflags '-s -w' -o agent-bridge-hook .

      - name: Canonical offline PowerShell suites
        id: offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $results = Join-Path $env:RUNNER_TEMP ("bridge-offline-{0}-{1}-{2}-{3}" -f
            $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:GITHUB_JOB, [guid]::NewGuid().ToString('N'))
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "results-directory=$results" -Encoding utf8
          $checkout = @(git rev-parse --verify HEAD)
          if ($LASTEXITCODE -ne 0 -or $checkout.Count -ne 1 -or $checkout[0] -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Cannot identify the checkout before the Offline run.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "checkout-sha=$($checkout[0])" -Encoding utf8
          $runner = Join-Path 'tests' 'run-tests.ps1'
          pwsh -NoProfile -File $runner -ResultsDirectory $results
          $runnerExit = $LASTEXITCODE
          exit $runnerExit

      # Success must retain the child-suite evidence too, not just a green job status.
      - name: Collect bounded Offline evidence
        id: offline-evidence
        if: ${{ always() }}
        shell: pwsh
        env:
          OFFLINE_RESULTS: ${{ steps.offline.outputs.results-directory }}
          OFFLINE_CHECKOUT_SHA: ${{ steps.offline.outputs.checkout-sha }}
          OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $bundle = Join-Path $tempRoot ("bridge-offline-evidence-" + [guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $bundle) { throw 'The evidence bundle already exists.' }
          [void](New-Item -ItemType Directory -Path $bundle -ErrorAction Stop)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "bundle-directory=$bundle" -Encoding utf8
          $sourceState = 'not-provided'
          $sourceErrorType = $null
          $results = $null
          if (-not [string]::IsNullOrWhiteSpace($env:OFFLINE_RESULTS)) {
            try {
              if (-not [IO.Path]::IsPathFullyQualified($env:OFFLINE_RESULTS)) { throw 'Results path is not absolute.' }
              $results = [IO.Path]::GetFullPath($env:OFFLINE_RESULTS)
              $comparison = if ($IsWindows) { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
              if (-not [string]::Equals([IO.Path]::GetDirectoryName($results), $tempRoot, $comparison)) {
                throw 'Results path is not a direct child of runner temp.'
              }
              $sourceState = 'missing'
              if (Test-Path -LiteralPath $results) {
                $directory = Get-Item -LiteralPath $results -Force
                if (-not $directory.PSIsContainer -or ($directory.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                  throw 'Results path is not an unlinked directory.'
                }
                $sourceState = 'present'
              }
            }
            catch {
              $sourceState = 'unavailable'
              $sourceErrorType = $_.Exception.GetType().FullName
            }
          }
          $names = @(
            'summary.json',
            'tests_test-registration-isolation_ps1.log',
            'tests_test-decision-lifecycle_ps1.log',
            'tests_test-write-boundary-callers_ps1.log'
          )
          $files = [Collections.Generic.List[object]]::new()
          foreach ($name in $names) {
            $entry = [ordered]@{ name = $name; state = 'missing'; bytes = $null; sha256 = $null; errorType = $null }
            if ($sourceState -eq 'unavailable') { $entry.state = 'unavailable' }
            elseif ($sourceState -eq 'present') {
              try {
                $source = Join-Path $results $name
                if (Test-Path -LiteralPath $source) {
                  $item = Get-Item -LiteralPath $source -Force
                  if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                    throw 'An allowlisted result is not an unlinked file.'
                  }
                  $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
                  $target = Join-Path $bundle $name
                  Copy-Item -LiteralPath $source -Destination $target -ErrorAction Stop
                  $entry.bytes = (Get-Item -LiteralPath $target).Length
                  $entry.sha256 = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
                  if ($entry.sha256 -cne $hash -or $entry.bytes -ne $item.Length) { throw 'Evidence copy differs from its source.' }
                  $entry.state = 'present'
                }
              }
              catch {
                $entry.state = 'error'
                $entry.errorType = $_.Exception.GetType().FullName
              }
            }
            $files.Add($entry)
          }
          $checkout = @(git rev-parse --verify HEAD)
          $checkoutSha = if ($LASTEXITCODE -eq 0 -and $checkout.Count -eq 1 -and $checkout[0] -cmatch '^[0-9a-f]{40}$') {
            $checkout[0]
          } else { $null }
          [ordered]@{
            schemaVersion = 1
            checkoutSha = $checkoutSha; offlineCheckoutSha = $env:OFFLINE_CHECKOUT_SHA
            eventSha = $env:CI_EVENT_SHA; workflowSha = $env:CI_WORKFLOW_SHA; workflowRef = $env:CI_WORKFLOW_REF
            prHeadSha = $(if ($env:CI_PR_HEAD_SHA) { $env:CI_PR_HEAD_SHA } else { $null })
            prBaseSha = $(if ($env:CI_PR_BASE_SHA) { $env:CI_PR_BASE_SHA } else { $null })
            runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT
            job = $env:GITHUB_JOB; os = $env:RUNNER_OS; offlineOutcome = $env:OFFLINE_OUTCOME
            sourceState = $sourceState; sourceErrorType = $sourceErrorType; files = $files.ToArray()
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $bundle 'provenance.json') -Encoding utf8
          if (-not $checkoutSha -or $sourceState -eq 'unavailable' -or @($files | Where-Object { $_.state -eq 'error' }).Count) {
            throw 'Offline evidence collection failed; see provenance.json for explicit availability states.'
          }
          if ($env:OFFLINE_OUTCOME -eq 'success' -and
              (@($files | Where-Object { $_.state -ne 'present' -or $_.bytes -eq 0 }).Count -or
               -not [StringComparer]::Ordinal.Equals($checkoutSha, $env:OFFLINE_CHECKOUT_SHA))) {
            throw 'A successful Offline run lacks required evidence or its checkout changed.'
          }

      - name: Upload bounded Offline evidence
        if: ${{ always() && steps.offline-evidence.outputs.bundle-directory != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ steps.offline-evidence.outputs.bundle-directory }}
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  installer-host:
    name: Installer host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    # Never move this job to self-hosted: -TargetHome is not an OS sandbox.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: hook/go.mod
          cache-dependency-path: hook/go.sum

      - name: Build the local installer payload (no runtime download)
        shell: pwsh
        working-directory: hook
        run: |
          $binary = if ($IsWindows) { 'agent-bridge-hook.exe' } else { 'agent-bridge-hook' }
          go build -trimpath -ldflags '-s -w' -o $binary .
          if ($LASTEXITCODE) { throw 'build failed' }

      - name: Installer assertions on a disposable host
        shell: pwsh
        run: pwsh -NoProfile -File tests/run-tests.ps1 -Group Host -AllowHostTests -TimeoutSeconds 300

  release-build:
    name: Release build of the native hook (no upload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: hook/go.mod
          cache-dependency-path: hook/go.sum

      # Exactly what release.yml runs, so a build that would break a release fails here.
      - name: Build every target, as a release does
        run: |
          set -euo pipefail
          bash hook/build-release.sh 0.0.0-ci "$PWD/dist"
          for name in agent-bridge-hook-windows-amd64.exe agent-bridge-hook-windows-arm64.exe \
                      agent-bridge-hook-darwin-amd64 agent-bridge-hook-darwin-arm64; do
            test -s "dist/$name" || { echo "::error::missing $name"; exit 1; }
            grep -q " $name\$" dist/SHA256SUMS || { echo "::error::$name not in SHA256SUMS"; exit 1; }
          done
          (cd dist && sha256sum -c SHA256SUMS)

  node:
    name: MCP server (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check server sources
        run: |
          for f in src/*.js; do node --check "$f"; done

      - name: MCP server tests
        run: |
          node test/test-config.js
          node test/test-ha.js
          node test/test-sessions.js
          node test/test-http.js
          node test/test-http-e2e.js
