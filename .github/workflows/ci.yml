name: CI

on:
  push:
    branches: [main, macos]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: PowerShell (parse, lint, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse-check every PowerShell file
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1 |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            ForEach-Object {
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
              if ($parseErrors -and $parseErrors.Count) {
                $errors += $parseErrors.Count
                foreach ($e in $parseErrors) {
                  Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                }
              }
            }
          if ($errors) { throw "$errors parse error(s) found" }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # The runner image sometimes ships without PSGallery registered, and is
          # migrating from PowerShellGet to PSResourceGet, so neither the repository
          # nor Install-Module can be assumed to be there.
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default -ErrorAction SilentlyContinue
            }
            if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
              Install-PSResource -Name PSScriptAnalyzer -TrustRepository -Scope CurrentUser -ErrorAction Stop
            }
            else {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
              Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
            }
          }
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $findings = Get-ChildItem -Recurse -Include *.ps1, *.psm1 |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1 }
          foreach ($f in $findings) {
            Write-Host "::warning file=$($f.ScriptName),line=$($f.Line)::$($f.RuleName): $($f.Message)"
          }
          if ($findings -and @($findings).Count) { throw "$(@($findings).Count) PSScriptAnalyzer finding(s)" }

      - name: PowerShell test suites (Home Assistant free)
        shell: pwsh
        run: |
          $suites = @(
            'tests/test-decision-args.ps1'
            'tests/test-decision-retry.ps1'
            'tests/test-decision-select-race.ps1'
            'tests/test-bridge-adapter.ps1'
            'tests/test-dashboard.ps1'
            'tests/test-install-clients.ps1'
            'tests/test-install-deps.ps1'
            'tests/test-install-connection.ps1'
            'tests/test-install-command.ps1'
            'tests/test-install-cards.ps1'
            'tests/test-multi-machine.ps1'
            'tests/test-layout-migration.ps1'
            'tests/test-reliability.ps1'
            'tests/test-restart-restore.ps1'
            'tests/test-security.ps1'
            'tests/test-update.ps1'
            'tests/test-update-outcome.ps1'
            'tests/test-new-session.ps1'
            'tests/test-stop-session.ps1'
            'tests/test-verbose-toggle.ps1'
            'codex/tests/test-codex.ps1'
            'claude/tests/test-claude-ask-parser.ps1'
            'claude/tests/test-claude-transcript.ps1'
          )
          $failed = @()
          foreach ($suite in $suites) {
            Write-Host "::group::$suite"
            pwsh -NoProfile -File $suite
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) {
              $failed += $suite
              Write-Host "::error::$suite exited with $code"
            }
          }
          if ($failed.Count) { throw "Failed suites: $($failed -join ', ')" }

  macos:
    name: macOS (platform layer, tmux delivery, suites)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tmux
        run: brew list tmux >/dev/null 2>&1 || brew install tmux

      - name: Parse-check every PowerShell file
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Include *.ps1 | Where-Object { $_.FullName -notmatch '/node_modules/' } | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            foreach ($e in @($parseErrors)) { $errors++; Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
          }
          if ($errors) { throw "$errors parse error(s) found" }

      - name: Platform layer and tmux delivery
        shell: pwsh
        run: pwsh -NoProfile -File tests/test-platform.ps1

      - name: Shell scripts
        run: |
          bash -n bootstrap.sh
          sh -n bin/agent-ha-bridge

      - name: Test suites on macOS
        shell: pwsh
        run: |
          $failed = @()
          foreach ($suite in @(Get-ChildItem tests/test-*.ps1, claude/tests/test-*.ps1, codex/tests/test-*.ps1 | Where-Object { $_.Name -notmatch 'integration|platform' })) {
            Write-Host "::group::$($suite.Name)"
            pwsh -NoProfile -File $suite.FullName
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) {
              $failed += $suite.Name
              Write-Host "::warning::$($suite.Name) exited with $code"
              # Why: run it again inside a caller that reports the script's own exit
              # code and whatever errors were recorded on the way out.
              pwsh -NoProfile -Command "& '$($suite.FullName)' *> `$null; Write-Host ('script exit code: ' + `$LASTEXITCODE); `$Error | Select-Object -First 8 | ForEach-Object { Write-Host ('error: ' + `$_ + ' @ ' + `$_.InvocationInfo.PositionMessage) }"
            }
          }
          Write-Host "Failed on macOS: $($failed -join ', ')"
          if ($failed.Count) { exit 1 }

  node:
    name: MCP server (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check server sources
        run: |
          for f in src/*.js; do node --check "$f"; done

      - name: MCP server tests
        run: |
          node test/test-ha.js
          node test/test-http.js
          node test/test-http-e2e.js

